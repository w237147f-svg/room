<!DOCTYPE HTML>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゼミ室 360度パノラマ 脱炭素クイズ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #panorama { width: 100vw; height: 100vh; }
        
        /* ▼ 電球アイコン（bulb.png）の設定 ▼ */
        .bulb-icon {
            width: 50px;
            height: 50px;
            background-image: url('./bulb.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ▼ クイズ画面のデザイン ▼ */
        #quiz-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            width: 85%;
            max-width: 520px;
        }
        #quiz-modal h3 { margin-top: 0; color: #0277bd; }
        .quiz-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            background: #e1f5fe;
            border: 2px solid #4fc3f7;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
            line-height: 1.4;
        }
        .quiz-btn:hover { background: #b3e5fc; }
        .close-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 15px;
            background: #757575;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- パノラマ表示エリア -->
<div id="panorama"></div>

<!-- クイズのポップアップ画面 -->
<div id="quiz-modal">
    <h3 id="quiz-title">🌱 脱炭素クイズ！</h3>
    <p id="quiz-question"></p>
    
    <div id="quiz-choices"></div>

    <div id="quiz-result" style="display:none; margin-top:15px; font-size: 14px; line-height: 1.6;"></div>
    
    <button class="close-btn" onclick="closeQuiz()">閉じる</button>
</div>

<script>
    pannellum.viewer('panorama', {
        "default": {
            "firstScene": "scene_normal",
            "autoLoad": true,
            "compass": false
        },
        "scenes": {
            // シーン1：通常のゼミ室（66.jpg）
            "scene_normal": {
                "type": "equirectangular",
                "panorama": "66.jpg",
                "hotSpots": [
                    {
                        "pitch": -10,
                        "yaw": 200,   // 水道への移動スポット
                        "type": "scene",
                        "text": "水道を見る（流す）",
                        "sceneId": "scene_water"
                    },
                    {
                        "pitch": 25,
                        "yaw": 55,    // エアコンへの移動スポット
                        "type": "scene",
                        "text": "エアコンを見る（使う）",
                        "sceneId": "scene_aircon"
                    },
                    {
                        "pitch": -2,
                        "yaw": 85,    // テレビ・モニターへの移動スポット（75.jpgへ）
                        "type": "scene",
                        "text": "テレビ・モニターエリアへ",
                        "sceneId": "scene_tv"
                    }
                ]
            },
            // シーン2：水が流れているゼミ室（68.jpg）
            "scene_water": {
                "type": "equirectangular",
                "panorama": "68.jpg",
                "hotSpots": [
                    {
                        "pitch": -25,
                        "yaw": 220,
                        "cssClass": "bulb-icon",
                        "clickHandlerFunc": showWaterQuiz
                    },
                    {
                        "pitch": -5,
                        "yaw": 60,   // 水道からテレビ（75.jpg）への移動スポット
                        "type": "scene",
                        "text": "テレビ・モニターを見る（75.jpg）",
                        "sceneId": "scene_tv"
                    },
                    {
                        "pitch": 0,
                        "yaw": 0,
                        "type": "scene",
                        "text": "元の位置に戻る",
                        "sceneId": "scene_normal"
                    }
                ]
            },
            // シーン3：テレビ・モニター稼働（75.jpg）★追加★
            "scene_tv": {
                "type": "equirectangular",
                "panorama": "75.jpg",
                "hotSpots": [
                    {
                        "pitch": -3,
                        "yaw": 55,    // 右側テレビ画面上の電球アイコン
                        "cssClass": "bulb-icon",
                        "clickHandlerFunc": showTvQuiz
                    },
                    {
                        "pitch": 0,
                        "yaw": -90,
                        "type": "scene",
                        "text": "水道を見る（流す）",
                        "sceneId": "scene_water"
                    },
                    {
                        "pitch": 0,
                        "yaw": -180,
                        "type": "scene",
                        "text": "元の位置に戻る",
                        "sceneId": "scene_normal"
                    }
                ]
            },
            // シーン4：エアコンが稼働しているゼミ室（70.jpg）
            "scene_aircon": {
                "type": "equirectangular",
                "panorama": "70.jpg",
                "hotSpots": [
                    {
                        "pitch": 25,
                        "yaw": 55,
                        "cssClass": "bulb-icon",
                        "clickHandlerFunc": showAirconQuiz
                    },
                    {
                        "pitch": -50,
                        "yaw": 190,   // 中央・デスク方向への移動スポット（72.jpgへ）
                        "type": "scene",
                        "text": "作業スペース・紙資料の場所へ移動",
                        "sceneId": "scene_paper"
                    },
                    {
                        "pitch": 0,
                        "yaw": 0,
                        "type": "scene",
                        "text": "元の位置に戻る",
                        "sceneId": "scene_normal"
                    }
                ]
            },
            // シーン5：デスク・資料スペース（72.jpg）
            "scene_paper": {
                "type": "equirectangular",
                "panorama": "72.jpg",
                "hotSpots": [
                    {
                        "pitch": -10,
                        "yaw": 0,     // テーブル・資料付近の電球アイコン
                        "cssClass": "bulb-icon",
                        "clickHandlerFunc": showPaperQuiz
                    },
                    {
                        "pitch": 0,
                        "yaw": 180,
                        "type": "scene",
                        "text": "元の位置に戻る",
                        "sceneId": "scene_normal"
                    }
                ]
            }
        }
    });

    let currentQuizType = "";

    // ▼ 1. 水道クイズ ▼
    function showWaterQuiz() {
        currentQuizType = "water";
        document.getElementById("quiz-title").innerText = "💧 水道エコアクションクイズ！";
        document.getElementById("quiz-question").innerText = "ゼミ室で手洗いやコップ洗いをするとき、最も脱炭素（CO2削減）につながる適切な行動はどれでしょう？";
        
        document.getElementById("quiz-choices").innerHTML = `
            <button class="quiz-btn" onclick="checkAnswer(1)">① 水量を細く弱めにして、洗い物の間もずっと流しっぱなしにする</button>
            <button class="quiz-btn" onclick="checkAnswer(2)">② 石けんをつける間やスポンジでこする間（30秒間）はこまめに水を止める</button>
            <button class="quiz-btn" onclick="checkAnswer(3)">③ 水量を強めにして、短時間で一気に流して終わらせる</button>
        `;
        openModal();
    }

    // ▼ 2. テレビ・モニタークイズ（追加） ▼
    function showTvQuiz() {
        currentQuizType = "tv";
        document.getElementById("quiz-title").innerText = "📺 テレビ・モニターエコアクションクイズ！";
        document.getElementById("quiz-question").innerText = "ゼミ室で大型モニターを使って発表や作業をした後、最も脱炭素（CO2削減）につながる適切な行動はどれでしょう？";
        
        document.getElementById("quiz-choices").innerHTML = `
            <button class="quiz-btn" onclick="checkAnswer(1)">① 使わない時はこまめに画面をスリープモードにする（輝度を適正に調整する）</button>
            <button class="quiz-btn" onclick="checkAnswer(2)">② 画面の焼き付きを防ぐため、点灯させたまま放置する</button>
            <button class="quiz-btn" onclick="checkAnswer(3)">③ スリープモードに設定せず、最高輝度のままにしておく</button>
        `;
        openModal();
    }

    // ▼ 3. エアコンクイズ ▼
    function showAirconQuiz() {
        currentQuizType = "aircon";
        document.getElementById("quiz-title").innerText = "❄️ エアコンエコアクションクイズ！";
        document.getElementById("quiz-question").innerText = "ゼミ室でエアコン（冷暖房）を使用するとき、最も脱炭素（CO2削減）につながる効果的な使い方はどれでしょう？";
        
        document.getElementById("quiz-choices").innerHTML = `
            <button class="quiz-btn" onclick="checkAnswer(1)">① 夏は室温28℃、冬は室温20℃を目安に適正温度に設定する</button>
            <button class="quiz-btn" onclick="checkAnswer(2)">② すぐに部屋を冷やそうと設定温度を極端にして風量を強にする</button>
            <button class="quiz-btn" onclick="checkAnswer(3)">③ 節電のため、30分ごとにこまめに電源のON/OFFを繰り返す</button>
        `;
        openModal();
    }

    // ▼ 4. 紙・ペーパーレスクイズ ▼
    function showPaperQuiz() {
        currentQuizType = "paper";
        document.getElementById("quiz-title").innerText = "📄 紙・ペーパーレスエコアクションクイズ！";
        document.getElementById("quiz-question").innerText = "ゼミの発表資料や配布資料の準備において、1回（1部）あたりのCO2排出削減量が最も大きい行動はどれでしょう？";
        
        document.getElementById("quiz-choices").innerHTML = `
            <button class="quiz-btn" onclick="checkAnswer(1)">① 資料を片面印刷ではなく「両面印刷」にして印刷する</button>
            <button class="quiz-btn" onclick="checkAnswer(2)">② 資料を1画面1ページではなく「4ページを1枚に集約」して印刷する</button>
            <button class="quiz-btn" onclick="checkAnswer(3)">③ 紙に印刷せず、PCやタブレットでデータを共有・閲覧する（ペーパーレス化）</button>
        `;
        openModal();
    }

    function openModal() {
        document.getElementById("quiz-modal").style.display = "block";
        document.getElementById("quiz-choices").style.display = "block";
        document.getElementById("quiz-result").style.display = "none";
    }

    function checkAnswer(answer) {
        document.getElementById("quiz-choices").style.display = "none";
        const resultDiv = document.getElementById("quiz-result");
        resultDiv.style.display = "block";

        if (currentQuizType === "water") {
            if (answer === 2) {
                resultDiv.innerHTML = "<strong style='color:#d32f2f; font-size:18px;'>正解！⭕</strong><br><br><b>【解説】</b><br>正解は「② こまめに水を止める」です！<br><br>30秒間水を止めるだけで1回あたり<b>約0.002 kg-CO2e</b>の削減効果があります[cite: 1]。水道水を送ったり綺麗にする浄水場・下水処理場では多くの電気が使われているため、使わない瞬間に「こまめに蛇口を止める」ことが重要です！[cite: 1]";
            } else {
                resultDiv.innerHTML = "<strong style='color:#1976d2; font-size:18px;'>残念！❌</strong><br><br><b>【正解】</b><br>正解は<b>「② 石けんをつける間やスポンジでこする間（30秒間）はこまめに水を止める」</b>です。<br><br><b>【解説】</b><br>30秒間水を止めるだけで1回あたり<b>約0.002 kg-CO2e</b>の削減効果があります[cite: 1]。使わない瞬間に「こまめに蛇口を止める」ことが最も効果的です！[cite: 1]";
            }
        } else if (currentQuizType === "tv") {
            if (answer === 1) {
                resultDiv.innerHTML = "<strong style='color:#d32f2f; font-size:18px;'>正解！⭕</strong><br><br><b>【解説】</b><br>正解は「① 使わない時はこまめに画面をスリープモードにする」です！<br><br>環境省のデコ活データベースによると、モニターやPCの輝度（明るさ）を適正に調整したり、不使用時に自動スリープ（待機電力約0.5W）へ移行させることで、<b>消費電力を約20%削減（1日あたり約0.084 kg-CO2e削減）</b>できます[cite: 1]！ゼミでの作業や発表が終わったら、こまめに画面をスリープ・消灯しましょう！[cite: 1]";
            } else {
                resultDiv.innerHTML = "<strong style='color:#1976d2; font-size:18px;'>残念！❌</strong><br><br><b>【正解】</b><br>正解は<b>「① 使わない時はこまめに画面をスリープモードにする（輝度を適正に調整する）」</b>です。<br><br><b>【解説】</b><br>環境省のデコ活データベースによると、スリープモードの活用や適正な輝度調整により、消費電力を<b>約20%削減（1日あたり約0.084 kg-CO2e削減）</b>できます[cite: 1]！使わない時間はこまめにスリープ・消灯することを習慣にしましょう！[cite: 1]";
            }
        } else if (currentQuizType === "aircon") {
            if (answer === 1) {
                resultDiv.innerHTML = "<strong style='color:#d32f2f; font-size:18px;'>正解！⭕</strong><br><br><b>【解説】</b><br>正解は「① 適正温度（夏28℃/冬20℃）に設定する」です！<br><br>エアコンの設定温度を無理のない範囲で調整する（冷房を1℃高く・暖房を1℃低く設定する）だけで、年間で約<b>30kg-CO2</b>もの削減効果があります！頻繁なON/OFFは起動時の消費電力が増えるため避けましょう。";
            } else {
                resultDiv.innerHTML = "<strong style='color:#1976d2; font-size:18px;'>残念！❌</strong><br><br><b>【正解】</b><br>正解は<b>「① 夏は室温28℃、冬は室温20℃を目安に適正温度に設定する」</b>です。<br><br><b>【解説】</b><br>設定温度を調整するだけで年間約<b>30kg-CO2</b>の大きな削減効果が得られます！";
            }
        } else if (currentQuizType === "paper") {
            if (answer === 3) {
                resultDiv.innerHTML = "<strong style='color:#d32f2f; font-size:18px;'>正解！⭕</strong><br><br><b>【解説】</b><br>正解は「③ 紙に印刷せず、PCやタブレットで共有する（ペーパーレス化）」です！<br><br>環境省のデコ活データベースによると、それぞれのCO2削減効果は以下の通りです：<br>・① 両面印刷にする：約 <b>0.009 kg-CO2e</b> / 部[cite: 1]<br>・② 4ページを1枚に集約印刷：約 <b>0.028 kg-CO2e</b> / 部[cite: 1]<br>・<b>③ 電子化・ペーパーレス化：約 0.042 kg-CO2e / 回</b>[cite: 1]<br><br>紙の製造や輸送、印刷時のトナー・電力消費をまるごと削減できる「ペーパーレス化」が最も効果的です！[cite: 1] 印刷が必要な場合でも、集約印刷や両面印刷を組み合わせることで大きな節減になります[cite: 1]。";
            } else {
                resultDiv.innerHTML = "<strong style='color:#1976d2; font-size:18px;'>残念！❌</strong><br><br><b>【正解】</b><br>正解は<b>「③ 紙に印刷せず、PCやタブレットでデータを共有・閲覧する（ペーパーレス化）」</b>です。<br><br><b>【解説】</b><br>環境省のデコ活データベースによると、それぞれのCO2削減効果は以下の通りです：<br>・① 両面印刷にする：約 <b>0.009 kg-CO2e</b> / 部[cite: 1]<br>・② 4ページを1枚に集約印刷：約 <b>0.028 kg-CO2e</b> / 部[cite: 1]<br>・<b>③ 電子化・ペーパーレス化：約 0.042 kg-CO2e / 回</b>[cite: 1]<br><br>紙の製造や印刷にかかるエネルギーをゼロにできる「ペーパーレス化」が最も高い脱炭素効果を持っています！[cite: 1]";
            }
        }
    }

    function closeQuiz() {
        document.getElementById("quiz-modal").style.display = "none";
    }
</script>

</body>
</html>
