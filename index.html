<!DOCTYPE HTML>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゼミ室 360度パノラマ 脱炭素クイズ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #panorama { width: 100vw; height: 100vh; }
        
        /* ▼ 電球アイコン（bulb.png）の設定 ▼ */
        .bulb-icon {
            width: 50px;
            height: 50px;
            background-image: url('./bulb.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ▼ クイズ画面のデザイン ▼ */
        #quiz-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            width: 85%;
            max-width: 520px;
        }
        #quiz-modal h3 { margin-top: 0; color: #0277bd; }
        .quiz-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            background: #e1f5fe;
            border: 2px solid #4fc3f7;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
            line-height: 1.4;
        }
        .quiz-btn:hover { background: #b3e5fc; }
        .close-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 15px;
            background: #757575;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- パノラマ表示エリア -->
<div id="panorama"></div>

<!-- クイズのポップアップ画面 -->
<div id="quiz-modal">
    <h3>💧 ゼミ室の水道エコアクションクイズ！</h3>
    <p>ゼミ室で手洗いやコップ洗いをするとき、最も脱炭素（CO2削減）につながる適切な行動はどれでしょう？</p>
    
    <div id="quiz-choices">
        <button class="quiz-btn" onclick="checkAnswer(1)">① 水量を細く弱めにして、手洗増や洗い物の間もずっと流しっぱなしにする</button>
        <button class="quiz-btn" onclick="checkAnswer(2)">② 石けんをつける間やスポンジでこする間（30秒間）はこまめに水を止める</button>
        <button class="quiz-btn" onclick="checkAnswer(3)">③ 水量を強めにして、短時間で一気に流して終わらせる</button>
    </div>

    <div id="quiz-result" style="display:none; margin-top:15px; font-size: 14px; line-height: 1.6;"></div>
    
    <button class="close-btn" onclick="closeQuiz()">閉じる</button>
</div>

<script>
    pannellum.viewer('panorama', {
        "default": {
            "firstScene": "scene_normal",
            "autoLoad": true,
            "compass": false
        },
        "scenes": {
            // シーン1：通常のゼミ室（66.jpg）
            "scene_normal": {
                "type": "equirectangular",
                "panorama": "66.jpg",
                "hotSpots": [
                    {
                        "pitch": -10,
                        "yaw": 200,   // 水道への移動スポット
                        "type": "scene",
                        "text": "水道を見る（流す）",
                        "sceneId": "scene_water"
                    }
                ]
            },
            // シーン2：水が流れているゼミ室（68.jpg）
            "scene_water": {
                "type": "equirectangular",
                "panorama": "68.jpg",
                "hotSpots": [
                    {
                        "pitch": -25,  // 下へ移動（-10 → -25）
                        "yaw": 220,    // 右へ移動（200 → 220）
                        "cssClass": "bulb-icon",
                        "clickHandlerFunc": showQuiz // クリックでクイズ表示
                    },
                    {
                        "pitch": 0,
                        "yaw": 0,
                        "type": "scene",
                        "text": "元の位置に戻る",
                        "sceneId": "scene_normal"
                    }
                ]
            }
        }
    });

    // ▼ クイズ用関数 ▼
    function showQuiz(event, args) {
        document.getElementById("quiz-modal").style.display = "block";
        document.getElementById("quiz-choices").style.display = "block";
        document.getElementById("quiz-result").style.display = "none";
    }

    function checkAnswer(answer) {
        document.getElementById("quiz-choices").style.display = "none";
        const resultDiv = document.getElementById("quiz-result");
        resultDiv.style.display = "block";

        if(answer === 2) {
            resultDiv.innerHTML = "<strong style='color:#d32f2f; font-size:18px;'>正解！⭕</strong><br><br><b>【解説】</b><br>正解は「② こまめに水を止める」です！<br><br>手洗いやコップ洗いの際、30秒間水を止めるだけで1回あたり<b>約0.002 kg-CO2e</b>の温室効果ガス削減効果があります[cite: 1]。<br><br>水道水を送ったりきれいに処理したりする浄水場・下水処理場では、多くの電力やエネルギーが使われています。水量を弱くしても流しっぱなしにすると消費量が増えるため、使わない瞬間に「こまめに蛇口を止める」ことが最も効果的な脱炭素アクションです！[cite: 1]";
        } else {
            resultDiv.innerHTML = "<strong style='color:#1976d2; font-size:18px;'>残念！❌</strong><br><br><b>【正解】</b><br>正解は<b>「② 石けんをつける間やスポンジでこする間（30秒間）はこまめに水を止める」</b>です。<br><br><b>【解説】</b><br>手洗いやコップ洗いの際、30秒間水を止めるだけで1回あたり<b>約0.002 kg-CO2e</b>の温室効果ガス削減効果があります[cite: 1]。<br><br>水道水を送ったりきれいに処理したりする浄水場・下水処理場では、多くの電力やエネルギーが使われています。水量を弱くしても流しっぱなしにすると消費量が増えるため、使わない瞬間に「こまめに蛇口を止める」ことが最も効果的な脱炭素アクションです！[cite: 1]";
        }
    }

    function closeQuiz() {
        document.getElementById("quiz-modal").style.display = "none";
    }
</script>

</body>
</html>
