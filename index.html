<!DOCTYPE HTML>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360度パノラマビューアー</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        #panorama { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<div id="panorama"></div>

<script>
    pannellum.viewer('panorama', {
        "default": {
            "firstScene": "scene_normal",
            "autoLoad": true,
            "compass": false
        },
        "scenes": {
            "scene_normal": {
                "type": "equirectangular",
                "panorama": "66.jpg",
                "hotSpots": [
                    {
                        "pitch": 0, // テスト用に真正面に配置しています
                        "yaw": 0,   
                        "type": "scene",
                        "text": "水道を見る",
                        "sceneId": "scene_water"
                    }
                ]
            },
            // ▼ 2つ目のシーン（水が流れている部屋）
            "scene_water": {
                "type": "equirectangular",
                "panorama": "68.jpg", // ← ここを 68_2.jpg から 68.jpg に修正しました！
                "hotSpots": [
                    {
                        "pitch": 0,
                        "yaw": 0,
                        "type": "scene",
                        "text": "元の位置に戻る",
                        "sceneId": "scene_normal"
                    }
                ]
            }
        }
    });
</script>

</body>
</html>
