<!DOCTYPE HTML>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360度パノラマビューアー</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        #panorama { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<div id="panorama"></div>

<script>
    pannellum.viewer('panorama', {
        "default": {
            "firstScene": "scene_normal", // 最初に読み込むシーン
            "autoLoad": true,
            "compass": false
        },
        "scenes": {
            // ▼ 1つ目のシーン（普段の部屋）
            "scene_normal": {
                "type": "equirectangular",
                "panorama": "66.jpg", // 元の画像ファイル名
                "hotSpots": [
                    {
                        "pitch": -15,   // ホットスポットの上下位置（必要に応じて数値を調整）
                        "yaw": 110,     // ホットスポットの左右位置（水道のある方向）
                        "type": "scene",
                        "text": "水道を見る",
                        "sceneId": "scene_water" // クリックで移動する先のID
                    }
                ]
            },
            // ▼ 2つ目のシーン（水が流れている部屋）
            "scene_water": {
                "type": "equirectangular",
                "panorama": "68_2.jpg", // 追加した水が流れる画像
                "hotSpots": [
                    {
                        "pitch": -10,
                        "yaw": -150,
                        "type": "scene",
                        "text": "元の位置に戻る",
                        "sceneId": "scene_normal" // クリックで最初のシーンに戻る
                    }
                ]
            }
        }
    });
</script>

</body>
</html>
